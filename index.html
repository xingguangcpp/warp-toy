<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WARP TOY · 抽象扭曲变形发生器</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --line:#e2e6ec; --ink:#1b1f24;
    --ink2:#5c6672; --ink3:#8b949f; --acc:#3b6ef5; --acc2:#e8effe;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:13px/1.5 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    overflow:hidden;
  }
  #app{display:flex; height:100vh; gap:14px; padding:14px}
  #stage{
    flex:1; display:flex; align-items:center; justify-content:center;
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    position:relative; overflow:hidden; min-width:0;
  }
  #c{max-width:100%; max-height:100%; display:block; background:#000; border-radius:6px}
  #hint{
    position:absolute; left:50%; top:14px; transform:translateX(-50%);
    background:rgba(27,31,36,.82); color:#fff; padding:5px 12px; border-radius:20px;
    font-size:12px; pointer-events:none; opacity:0; transition:opacity .25s;
  }
  #hint.on{opacity:1}
  #panel{
    width:310px; flex:none; background:var(--card); border:1px solid var(--line);
    border-radius:12px; padding:12px; overflow-y:auto;
  }
  h1{font-size:14px; margin:0 0 2px; letter-spacing:.5px}
  .sub{font-size:11px; color:var(--ink3); margin-bottom:12px}
  .grp{margin-bottom:12px}
  .grp>.gt{
    font-size:11px; color:var(--ink3); font-weight:600; letter-spacing:1px;
    padding:6px 0 4px; border-bottom:1px solid var(--line); margin-bottom:7px;
  }
  .row{display:flex; align-items:center; gap:8px; margin-bottom:5px}
  .row label{flex:1; font-size:12px; color:var(--ink2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .row input[type=range]{width:120px; flex:none; accent-color:var(--acc)}
  .row .v{width:44px; text-align:right; font-size:11px; color:var(--ink3); font-variant-numeric:tabular-nums}
  .row input[type=checkbox]{accent-color:var(--acc); width:15px; height:15px}
  select,input[type=number]{
    width:100%; height:28px; border:1px solid var(--line); border-radius:6px;
    background:#fff; color:var(--ink); padding:0 7px; font-size:12px;
  }
  .two{display:flex; gap:7px; margin-bottom:7px}
  .two>*{flex:1}
  button{
    height:30px; border:1px solid var(--line); background:#fff; color:var(--ink);
    border-radius:7px; cursor:pointer; font-size:12px; padding:0 10px;
    font-family:inherit;
  }
  button:hover{background:var(--acc2); border-color:#c3d3fb}
  button.pri{background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600}
  button.pri:hover{background:#2f5fe0}
  button.rec{background:#e0344b; border-color:#e0344b; color:#fff; font-weight:600}
  button.rec:hover{background:#c62a3f}
  .field{margin-bottom:7px}
  .field .fl{font-size:11px; color:var(--ink3); margin-bottom:3px}
  .status{
    font-size:11px; color:var(--ink2); background:var(--bg); border:1px solid var(--line);
    border-radius:6px; padding:6px 8px; margin-top:10px; min-height:28px;
  }
  .tag{display:inline-block; font-size:10px; color:var(--ink3); margin-top:8px; line-height:1.6}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="hint"></div>
  </div>

  <aside id="panel">
    <h1>WARP TOY</h1>
    <div class="sub">扭曲 / 反馈 / 抽象 · 拖素材进画面即可</div>

    <div class="grp"><div class="gt">输出</div>
      <div class="two">
        <select id="res">
          <option value="1920x1080">横屏 1920×1080</option>
          <option value="1080x1920">竖屏 1080×1920</option>
          <option value="1080x1080">方形 1080×1080</option>
          <option value="1280x720">横屏 1280×720</option>
          <option value="720x1280">竖屏 720×1280</option>
        </select>
        <select id="scale">
          <option value="1">画质 1.0x</option>
          <option value="0.75">画质 0.75x</option>
          <option value="0.5">画质 0.5x</option>
        </select>
      </div>
      <div class="two">
        <select id="fps">
          <option value="60">60 fps</option>
          <option value="30" selected>30 fps</option>
          <option value="24">24 fps</option>
        </select>
        <input id="dur" type="number" value="15" min="0" step="1" title="录制秒数，0 = 手动停止">
      </div>
      <div class="two">
        <button id="recBtn" class="rec">● 录制</button>
        <button id="pngBtn">存 PNG</button>
      </div>
    </div>

    <div class="grp"><div class="gt">预设 / 随机</div>
      <div class="field">
        <select id="preset"></select>
      </div>
      <div class="two">
        <button id="randBtn">🎲 随机全部</button>
        <button id="randWBtn">🎲 只拧扭曲</button>
      </div>
      <div class="two">
        <button id="resetBtn">恢复默认</button>
        <button id="clearBtn">清空残影</button>
      </div>
    </div>

    <div class="grp"><div class="gt">素材</div>
      <div class="two">
        <button id="fileBtn">导入图片/视频</button>
        <button id="camBtn">摄像头</button>
      </div>
      <input id="file" type="file" accept="image/*,video/*" hidden>
      <div id="srcName" class="tag">当前：程序化生成（无素材）</div>
    </div>

    <div id="params"></div>

    <div class="status" id="st">就绪。</div>
    <div class="tag">
      拖入图片/视频到左侧画面 → 素材会被实时扭曲。<br>
      反馈相关的参数（缩放/旋转/衰减）是产生无限隧道、拖影、融化的关键，配合高反馈量使用。<br>
      录制卡顿时把「画质」降到 0.5x。
    </div>
  </aside>
</div>

<script>
"use strict";

/* ---------------- 参数定义 ---------------- */
const PARAMS = [
  {g:'扭曲', k:'freq',   n:'噪声频率', min:0.2,  max:10,  step:0.01,   def:2.4},
  {g:'扭曲', k:'speed',  n:'演化速度', min:0,    max:3,   step:0.01,   def:0.6},
  {g:'扭曲', k:'warp',   n:'扭曲强度', min:0,    max:3,   step:0.01,   def:0.8},
  {g:'扭曲', k:'twirl',  n:'漩涡',     min:-3,   max:3,   step:0.01,   def:0.3},
  {g:'扭曲', k:'wave',   n:'波纹',     min:0,    max:2,   step:0.01,   def:0.25},
  {g:'扭曲', k:'kaleido',n:'万花筒',   min:0,    max:16,  step:1,      def:0},
  {g:'反馈', k:'fb',     n:'反馈量',   min:0,    max:1,   step:0.01,   def:0.55},
  {g:'反馈', k:'zoom',   n:'反馈缩放', min:0.96, max:1.06,step:0.0005, def:1.008, dp:4},
  {g:'反馈', k:'rot',    n:'反馈旋转', min:-3,   max:3,   step:0.01,   def:0.15},
  {g:'反馈', k:'decay',  n:'残留衰减', min:0.5,  max:1.05,step:0.005,  def:0.98, dp:3},
  {g:'采样', k:'pixel',  n:'像素化',   min:0,    max:1,   step:0.01,   def:0},
  {g:'采样', k:'aberr',  n:'色散',     min:0,    max:1,   step:0.01,   def:0.15},
  {g:'色彩', k:'hue',    n:'色相',     min:0,    max:1,   step:0.01,   def:0},
  {g:'色彩', k:'sat',    n:'饱和度',   min:0,    max:2,   step:0.01,   def:1},
  {g:'色彩', k:'post',   n:'色阶',     min:0,    max:1,   step:0.01,   def:0},
  {g:'色彩', k:'invert', n:'反相',     t:'check', def:0},
  {g:'源',   k:'srcMix', n:'素材混合', min:0,    max:1,   step:0.01,   def:0.85},
];

const PRESETS = {
  '默认起点': {freq:2.4,speed:0.6,warp:0.8,twirl:0.3,wave:0.25,kaleido:0,fb:0.55,zoom:1.008,rot:0.15,decay:0.98,pixel:0,aberr:0.15,hue:0,sat:1,post:0,invert:0,srcMix:0.85},
  '深渊隧道': {freq:1.6,speed:0.35,warp:0.5,twirl:0.2,wave:0.1,kaleido:0,fb:0.92,zoom:1.022,rot:0.28,decay:1.0,pixel:0,aberr:0.3,hue:0.05,sat:1.1,post:0,invert:0,srcMix:0.9},
  '液体金属': {freq:3.2,speed:0.8,warp:1.7,twirl:0.6,wave:0.45,kaleido:0,fb:0.35,zoom:1.004,rot:0.1,decay:0.95,pixel:0,aberr:0.1,hue:0.15,sat:1.4,post:0,invert:0,srcMix:1},
  '数据损坏': {freq:6,speed:1.5,warp:2.2,twirl:0,wave:1.2,kaleido:0,fb:0.5,zoom:1.0,rot:0,decay:0.9,pixel:0.55,aberr:0.7,hue:0.3,sat:1.8,post:0.35,invert:0,srcMix:0.9},
  '万花筒':   {freq:2,speed:0.5,warp:0.9,twirl:0.8,wave:0.2,kaleido:8,fb:0.7,zoom:1.012,rot:0.4,decay:0.99,pixel:0,aberr:0.25,hue:0.6,sat:1.5,post:0,invert:0,srcMix:0.7},
  '故障风暴': {freq:8,speed:2.6,warp:2.8,twirl:1.6,wave:1.8,kaleido:3,fb:0.85,zoom:1.035,rot:1.2,decay:1.02,pixel:0.3,aberr:0.9,hue:0.85,sat:2,post:0.5,invert:1,srcMix:0.6},
  '融化人脸': {freq:1.2,speed:0.25,warp:1.2,twirl:0.1,wave:0.6,kaleido:0,fb:0.75,zoom:1.006,rot:0.05,decay:0.995,pixel:0.1,aberr:0.2,hue:0.2,sat:1.3,post:0,invert:0,srcMix:0.95},
};

const P = {};
PARAMS.forEach(p => P[p.k] = p.def);

/* ---------------- UI ---------------- */
const paramsEl = document.getElementById('params');
const inputs = {};
let lastGroup = null, groupEl = null;

PARAMS.forEach(p => {
  if (p.g !== lastGroup) {
    lastGroup = p.g;
    groupEl = document.createElement('div');
    groupEl.className = 'grp';
    const t = document.createElement('div');
    t.className = 'gt'; t.textContent = p.g;
    groupEl.appendChild(t);
    paramsEl.appendChild(groupEl);
  }
  const row = document.createElement('div');
  row.className = 'row';
  if (p.t === 'check') {
    const lb = document.createElement('label');
    lb.textContent = p.n;
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !!P[p.k];
    cb.onchange = () => { P[p.k] = cb.checked ? 1 : 0; };
    inputs[p.k] = cb;
    row.appendChild(lb); row.appendChild(cb);
  } else {
    const lb = document.createElement('label');
    lb.textContent = p.n;
    const sl = document.createElement('input');
    sl.type = 'range'; sl.min = p.min; sl.max = p.max; sl.step = p.step; sl.value = P[p.k];
    const vv = document.createElement('span');
    vv.className = 'v';
    const fmt = x => (p.dp ? x.toFixed(p.dp) : (Math.abs(x) >= 10 ? x.toFixed(1) : x.toFixed(2)));
    vv.textContent = fmt(P[p.k]);
    sl.oninput = () => { P[p.k] = parseFloat(sl.value); vv.textContent = fmt(P[p.k]); };
    inputs[p.k] = {sl, vv, fmt};
    row.appendChild(lb); row.appendChild(sl); row.appendChild(vv);
  }
  groupEl.appendChild(row);
});

function syncUI(){
  PARAMS.forEach(p => {
    const ui = inputs[p.k];
    if (p.t === 'check') { ui.checked = !!P[p.k]; }
    else { ui.sl.value = P[p.k]; ui.vv.textContent = ui.fmt(P[p.k]); }
  });
}

const presetSel = document.getElementById('preset');
Object.keys(PRESETS).forEach(k => {
  const o = document.createElement('option'); o.value = k; o.textContent = k;
  presetSel.appendChild(o);
});
presetSel.onchange = () => { Object.assign(P, PRESETS[presetSel.value]); syncUI(); clearBuf(); };

function rnd(a,b){ return a + Math.random()*(b-a); }
function randomize(onlyWarp){
  const keys = onlyWarp ? ['freq','speed','warp','twirl','wave','kaleido'] : null;
  PARAMS.forEach(p => {
    if (keys && keys.indexOf(p.k) < 0) return;
    if (p.k === 'kaleido') { P[p.k] = Math.random() < 0.55 ? 0 : Math.round(rnd(3,12)); }
    else if (p.t === 'check') { P[p.k] = Math.random() < 0.25 ? 1 : 0; }
    else { P[p.k] = rnd(p.min, p.max); }
  });
  syncUI();
}
document.getElementById('randBtn').onclick = () => randomize(false);
document.getElementById('randWBtn').onclick = () => randomize(true);
document.getElementById('resetBtn').onclick = () => { Object.assign(P, PRESETS['默认起点']); syncUI(); clearBuf(); };

/* ---------------- WebGL ---------------- */
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', {antialias:false, preserveDrawingBuffer:true, alpha:false});
if (!gl) {
  document.getElementById('st').textContent = '浏览器不支持 WebGL2，换 Chrome / Edge 新版本。';
  throw new Error('no webgl2');
}

const VS = `#version 300 es
void main(){
  vec2 pos = vec2(float((gl_VertexID & 1) << 2) - 1.0, float((gl_VertexID & 2) << 1) - 1.0);
  gl_Position = vec4(pos, 0.0, 1.0);
}`;

const FS = `#version 300 es
precision highp float;
out vec4 fragColor;

uniform vec2  uRes;
uniform float uTime;
uniform sampler2D uSrc;
uniform sampler2D uPrev;
uniform float uHasSrc, uSrcMix, uSrcAspect;
uniform float uFreq, uSpeed, uWarp, uTwirl, uWave, uKaleido;
uniform float uFb, uZoom, uRot, uDecay;
uniform float uPixel, uAberr, uHue, uSat, uPost, uInvert;

float hash(vec2 p){
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0,0.0)), u.x),
             mix(hash(i + vec2(0.0,1.0)), hash(i + vec2(1.0,1.0)), u.x), u.y);
}
float fbm(vec2 p){
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 4; i++){ v += a * noise(p); p *= 2.03; a *= 0.5; }
  return v;
}
vec3 palette(float t){
  return 0.5 + 0.5 * cos(6.28318 * (t * 1.35 + vec3(0.0, 0.33, 0.67)));
}

void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 p  = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  float t = uTime;

  // 万花筒折叠
  if (uKaleido > 0.5){
    float seg = uKaleido;
    float a = atan(p.y, p.x);
    float r = length(p);
    float seg2 = 6.28318 / seg;
    a = mod(a, seg2);
    a = abs(a - seg2 * 0.5);
    p = r * vec2(cos(a), sin(a));
  }

  // 漩涡（按半径衰减的旋转）
  float r0 = length(p);
  float a0 = atan(p.y, p.x) + uTwirl / (0.25 + r0) * 0.6;
  p = vec2(cos(a0), sin(a0)) * r0;

  // 正弦波纹
  p += uWave * 0.12 * vec2(sin(p.y * 7.0 + t * uSpeed * 2.0), cos(p.x * 7.0 - t * uSpeed * 1.7));

  // domain warping：用噪声场偏移采样坐标
  vec2 q = vec2(fbm(p * uFreq + vec2(0.0, 0.0) + t * uSpeed * 0.22),
                fbm(p * uFreq + vec2(5.2, 1.3) - t * uSpeed * 0.18));
  vec2 warped = p + (q - 0.5) * uWarp * 1.2;

  // ---- 采样素材（cover 适配：按画布/素材宽高比裁切，不变形）----
  vec3 srcCol = vec3(0.0);
  if (uHasSrc > 0.5){
    float A = uRes.x / uRes.y;
    vec2 suv = warped / vec2(A, 1.0);
    float k = uSrcAspect / A;
    if (k > 1.0) suv.x /= k; else suv.y *= k;
    suv += 0.5;
    vec2 off = vec2(uAberr * 0.02, 0.0);
    srcCol.r = texture(uSrc, suv + off).r;
    srcCol.g = texture(uSrc, suv).g;
    srcCol.b = texture(uSrc, suv - off).b;
  }

  // ---- 程序化色彩（fbm + domain warping + cosine 调色板）----
  vec3 genCol;
  {
    vec2 w2 = warped * uFreq * 0.8;
    vec2 q2 = vec2(fbm(w2 + t * uSpeed * 0.15),
                   fbm(w2 + vec2(3.7, 8.1) - t * uSpeed * 0.12));
    float f = fbm(w2 + 3.0 * (q2 - 0.5));
    genCol = palette(f * 1.6 + t * uSpeed * 0.05 + length(warped) * 0.15);
  }

  float mixSrc = uHasSrc > 0.5 ? uSrcMix : 0.0;
  vec3 col = mix(genCol, srcCol, mixSrc);

  // ---- 帧反馈：缩放 + 旋转采样上一帧 ----
  vec2 fbUV = uv - 0.5;
  fbUV /= uZoom;
  float ra = uRot * 0.02;
  float cs = cos(ra), sn = sin(ra);
  fbUV = mat2(cs, sn, -sn, cs) * fbUV;
  fbUV += 0.5;
  vec3 prev = texture(uPrev, fbUV).rgb * uDecay;
  col = mix(col, max(col, prev), uFb);

  // ---- 后处理 ----
  if (uPixel > 0.001){
    float g = mix(uRes.x, 24.0, uPixel);
    vec2 guv = (floor(gl_FragCoord.xy / (uRes.x / g)) + 0.5) * (uRes.x / g);
    fbUV = guv / uRes;
    col = mix(col, texture(uPrev, fbUV).rgb, uPixel * 0.6);
  }
  // 色相旋转
  float h = uHue * 6.28318;
  vec3 k = vec3(0.57735);
  float c = cos(h), s = sin(h);
  col = col * c + cross(k, col) * s + k * dot(k, col) * (1.0 - c);
  // 饱和度
  float lum = dot(col, vec3(0.2126, 0.7152, 0.0722));
  col = mix(vec3(lum), col, uSat);
  // 色阶（用后处理后的亮度重新计算，避免和上面的 lum 串味）
  if (uPost > 0.001){
    float l2 = dot(col, vec3(0.2126, 0.7152, 0.0722));
    float steps = mix(32.0, 3.0, uPost);
    col = mix(col, vec3(floor(l2 * steps) / steps), uPost);
  }
  if (uInvert > 0.5) col = 1.0 - col;

  fragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;

const FS_BLIT = `#version 300 es
precision highp float;
uniform sampler2D uTex;
out vec4 o;
void main(){ o = vec4(texture(uTex, gl_FragCoord.xy / vec2(textureSize(uTex, 0))).rgb, 1.0); }`;

function sh(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    throw new Error(gl.getShaderInfoLog(s));
  }
  return s;
}
function prog(fs){
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, VS));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}
let pMain, pBlit;
try {
  pMain = prog(FS);
  pBlit = prog(FS_BLIT);
} catch (err) {
  document.getElementById('st').textContent = 'Shader 编译失败：' + err.message;
  throw err;
}

const U = {};
['uRes','uTime','uSrc','uPrev','uHasSrc','uSrcMix','uSrcAspect','uFreq','uSpeed','uWarp',
 'uTwirl','uWave','uKaleido','uFb','uZoom','uRot','uDecay','uPixel','uAberr','uHue','uSat',
 'uPost','uInvert'].forEach(n => U[n] = gl.getUniformLocation(pMain, n));
U.uTex = gl.getUniformLocation(pBlit, 'uTex');

function makeTarget(w, h){
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.MIRRORED_REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.MIRRORED_REPEAT);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return {tex, fb, w, h};
}

let W = 1280, H = 720, tgt = [], cur = 0;

function resize(){
  const r = document.getElementById('res').value.split('x').map(Number);
  const s = parseFloat(document.getElementById('scale').value);
  W = Math.max(64, Math.round(r[0] * s));
  H = Math.max(64, Math.round(r[1] * s));
  canvas.width = W; canvas.height = H;
  tgt = [makeTarget(W, H), makeTarget(W, H)];
  cur = 0;
  clearBuf();
}
function clearBuf(){
  gl.clearColor(0, 0, 0, 1);
  for (let i = 0; i < tgt.length; i++){
    gl.bindFramebuffer(gl.FRAMEBUFFER, tgt[i].fb);
    gl.clear(gl.COLOR_BUFFER_BIT);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}
document.getElementById('res').onchange = resize;
document.getElementById('scale').onchange = resize;
document.getElementById('clearBtn').onclick = clearBuf;
resize();

/* ---------------- 素材 ---------------- */
const srcTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, srcTex);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0,0,0,255]));
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.MIRRORED_REPEAT);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.MIRRORED_REPEAT);

let hasSrc = 0, srcAspect = 1, srcVideo = null, srcImage = null, srcStream = null, srcDirty = false;
const srcName = document.getElementById('srcName');

function uploadFrame(){
  if (srcVideo){
    gl.bindTexture(gl.TEXTURE_2D, srcTex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    try {
      if (srcVideo.readyState >= 2 && srcVideo.videoWidth > 0){
        srcAspect = srcVideo.videoWidth / srcVideo.videoHeight;
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, srcVideo);
        hasSrc = 1;
      }
    } catch(e) { /* 视频帧偶发上传失败，跳过这一帧 */ }
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  } else if (srcImage && srcDirty){
    srcDirty = false;
    gl.bindTexture(gl.TEXTURE_2D, srcTex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, srcImage);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    srcAspect = srcImage.width / srcImage.height;
    hasSrc = 1;
  }
}

function stopCam(){
  if (srcStream) { srcStream.getTracks().forEach(t => t.stop()); srcStream = null; }
}
function setImage(img){
  stopCam();
  srcVideo = null; srcImage = img; srcDirty = true; clearBuf();
  srcName.textContent = '当前：图片 ' + img.width + '×' + img.height;
}
function setVideo(v, label){
  stopCam();
  srcImage = null; srcVideo = v; v.loop = true; v.muted = true; v.play().catch(()=>{});
  clearBuf();
  srcName.textContent = '当前：' + label;
}

document.getElementById('fileBtn').onclick = () => document.getElementById('file').click();
document.getElementById('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const url = URL.createObjectURL(f);
  if (f.type.indexOf('video') === 0){
    const v = document.createElement('video');
    v.src = url; v.muted = true; v.loop = true; v.crossOrigin = 'anonymous';
    setVideo(v, f.name);
  } else {
    const img = new Image();
    img.onload = () => setImage(img);
    img.src = url;
  }
};

document.getElementById('camBtn').onclick = async () => {
  try {
    const s = await navigator.mediaDevices.getUserMedia({video:{width:1280,height:720}, audio:false});
    stopCam(); srcStream = s;
    const v = document.createElement('video');
    v.srcObject = s; v.muted = true; v.play().catch(()=>{});
    srcImage = null; srcVideo = v; clearBuf();
    srcName.textContent = '当前：摄像头';
  } catch(e){ srcName.textContent = '摄像头不可用：' + e.message; }
};

const stage = document.getElementById('stage');
const hint = document.getElementById('hint');
function tip(msg){
  hint.textContent = msg; hint.classList.add('on');
  clearTimeout(tip._t); tip._t = setTimeout(() => hint.classList.remove('on'), 1600);
}
['dragenter','dragover'].forEach(ev => stage.addEventListener(ev, e => { e.preventDefault(); }));
stage.addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0]; if (!f) return;
  const url = URL.createObjectURL(f);
  if (f.type.indexOf('video') === 0){
    const v = document.createElement('video');
    v.src = url; v.muted = true; v.loop = true;
    setVideo(v, f.name); tip('素材已载入：' + f.name);
  } else if (f.type.indexOf('image') === 0){
    const img = new Image();
    img.onload = () => { setImage(img); tip('素材已载入：' + f.name); };
    img.src = url;
  } else { tip('只认图片和视频'); }
});

/* ---------------- 渲染循环 ---------------- */
let t0 = performance.now(), savePNG = false;

function frame(now){
  const t = (now - t0) * 0.001;

  uploadFrame();

  gl.useProgram(pMain);
  gl.bindFramebuffer(gl.FRAMEBUFFER, tgt[1 - cur].fb);
  gl.viewport(0, 0, W, H);

  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, srcTex); gl.uniform1i(U.uSrc, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, tgt[cur].tex); gl.uniform1i(U.uPrev, 1);

  gl.uniform2f(U.uRes, W, H);
  gl.uniform1f(U.uTime, t);
  gl.uniform1f(U.uHasSrc, hasSrc);
  gl.uniform1f(U.uSrcMix, P.srcMix);
  gl.uniform1f(U.uSrcAspect, srcAspect);
  gl.uniform1f(U.uFreq, P.freq);
  gl.uniform1f(U.uSpeed, P.speed);
  gl.uniform1f(U.uWarp, P.warp);
  gl.uniform1f(U.uTwirl, P.twirl);
  gl.uniform1f(U.uWave, P.wave);
  gl.uniform1f(U.uKaleido, P.kaleido);
  gl.uniform1f(U.uFb, P.fb);
  gl.uniform1f(U.uZoom, P.zoom);
  gl.uniform1f(U.uRot, P.rot);
  gl.uniform1f(U.uDecay, P.decay);
  gl.uniform1f(U.uPixel, P.pixel);
  gl.uniform1f(U.uAberr, P.aberr);
  gl.uniform1f(U.uHue, P.hue);
  gl.uniform1f(U.uSat, P.sat);
  gl.uniform1f(U.uPost, P.post);
  gl.uniform1f(U.uInvert, P.invert ? 1 : 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  cur = 1 - cur;

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.useProgram(pBlit);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tgt[cur].tex);
  gl.uniform1i(U.uTex, 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  if (savePNG){
    savePNG = false;
    const a = document.createElement('a');
    a.download = 'warp_' + Date.now() + '.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

document.getElementById('pngBtn').onclick = () => { savePNG = true; };

/* ---------------- 录制 ---------------- */
let rec = null, chunks = [], recStopTimer = null;
const recBtn = document.getElementById('recBtn');
const stEl = document.getElementById('st');

function pickMime(){
  const cands = ['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm'];
  for (const m of cands) if (MediaRecorder.isTypeSupported(m)) return m;
  return '';
}
recBtn.onclick = () => {
  if (rec && rec.state === 'recording'){ stopRec(); return; }
  const fps = parseInt(document.getElementById('fps').value, 10);
  const dur = parseFloat(document.getElementById('dur').value) || 0;
  const mime = pickMime();
  if (!mime){ stEl.textContent = '这个浏览器不支持 MediaRecorder 录制。'; return; }
  try {
    const stream = canvas.captureStream(fps);
    rec = new MediaRecorder(stream, {mimeType: mime, videoBitsPerSecond: 12e6});
    chunks = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      const blob = new Blob(chunks, {type: mime.split(';')[0]});
      const ext = mime.indexOf('mp4') === 0 ? 'mp4' : 'webm';
      const a = document.createElement('a');
      a.download = 'warp_' + Date.now() + '.' + ext;
      a.href = URL.createObjectURL(blob);
      a.click();
      stEl.textContent = '录制完成：' + (blob.size / 1048576).toFixed(1) + ' MB' +
        (ext === 'webm' ? '（webm，剪辑软件不认就用 ffmpeg 转 mp4）' : '');
      recBtn.textContent = '● 录制';
      recBtn.classList.add('rec');
    };
    rec.start(200);
    recBtn.textContent = '■ 停止';
    recBtn.classList.remove('rec');
    stEl.textContent = '录制中…' + (dur > 0 ? ' 目标 ' + dur + ' 秒' : ' 点按钮停止');
    if (dur > 0) recStopTimer = setTimeout(stopRec, dur * 1000);
  } catch(e){ stEl.textContent = '录制失败：' + e.message; }
};
function stopRec(){
  if (recStopTimer) { clearTimeout(recStopTimer); recStopTimer = null; }
  if (rec && rec.state === 'recording') rec.stop();
}
window.addEventListener('keydown', e => {
  if (e.code === 'Space'){ e.preventDefault(); (Math.random() < 0.5) ? randomize(false) : randomize(true); }
  if (e.code === 'KeyR' && !e.ctrlKey) recBtn.click();
});
</script>
